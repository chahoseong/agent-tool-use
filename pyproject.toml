[project]
name = "agent-tool-use"
version = "0.1.0"
description = "Observe agent tool selection, execution, and evaluation in tau2-bench."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
]

[tool.uv.sources]
tau2 = { path = "../tau2-bench" }

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["scripts", "agents", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

# tau2 ships annotations without a py.typed marker. Read those annotations,
# while keeping diagnostics focused on this project's code.
[[tool.mypy.overrides]]
module = ["tau2", "tau2.*"]
follow_untyped_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
